<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnlyUs ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      height: 60px;
      background: #111;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
    }

    header h2 {
      margin: 0;
      font-size: 20px;
    }

    .call-buttons button {
      border: none;
      background: #333;
      color: white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 19px;
      margin-left: 5px;
    }

    #messages {
      height: calc(100vh - 125px);
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      max-width: 75%;
      padding: 10px 13px;
      margin: 7px 0;
      border-radius: 15px;
      word-wrap: break-word;
    }

    .mine {
      margin-left: auto;
      background: #111;
      color: white;
    }

    .theirs {
      margin-right: auto;
      background: white;
      color: #111;
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: white;
      display: flex;
      align-items: center;
      padding: 8px;
      border-top: 1px solid #ddd;
    }

    #messageInput {
      flex: 1;
      height: 45px;
      border: 1px solid #ddd;
      border-radius: 25px;
      padding: 0 15px;
      outline: none;
      font-size: 16px;
    }

    #sendBtn {
      width: 45px;
      height: 45px;
      margin-left: 7px;
      border: none;
      border-radius: 50%;
      background: #111;
      color: white;
      font-size: 18px;
    }

    #callScreen {
      display: none;
      position: fixed;
      inset: 0;
      background: #111;
      z-index: 1000;
      color: white;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    #callTitle {
      font-size: 25px;
      margin-bottom: 20px;
    }

    #remoteVideo {
      width: 100%;
      max-width: 500px;
      max-height: 70vh;
      background: black;
      display: none;
      object-fit: cover;
      border-radius: 12px;
    }

    #localVideo {
      position: absolute;
      right: 15px;
      top: 15px;
      width: 120px;
      height: 170px;
      background: #222;
      object-fit: cover;
      border-radius: 10px;
      display: none;
    }

    #callStatus {
      margin-bottom: 20px;
      color: #ccc;
    }

    #endCallBtn {
      margin-top: 25px;
      width: 65px;
      height: 65px;
      border: none;
      border-radius: 50%;
      background: #d00;
      color: white;
      font-size: 25px;
    }
  </style>
</head>

<body>

<header>
  <h2>OnlyUs ❤️</h2>

  <div class="call-buttons">
    <button onclick="startAudioCall()">📞</button>
    <button onclick="startVideoCall()">🎥</button>
  </div>
</header>

<div id="messages"></div>

<div class="bottom">
  <input id="messageInput" placeholder="Message..." autocomplete="off">
  <button id="sendBtn">➤</button>
</div>

<!-- CALL SCREEN -->
<div id="callScreen">

  <div id="callTitle">OnlyUs ❤️</div>

  <div id="callStatus">Calling...</div>

  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay muted playsinline></video>

  <button id="endCallBtn" onclick="endCall()">📞</button>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

let myUsername = "";
let partnerUsername = "";

let peerConnection = null;
let localStream = null;

let currentCallType = null;
let currentCallPartner = null;

const messagesDiv = document.getElementById("messages");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

const callScreen = document.getElementById("callScreen");
const callTitle = document.getElementById("callTitle");
const callStatus = document.getElementById("callStatus");

const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");


// ==========================
// GET CURRENT USER
// ==========================

async function getMyUser() {

  const response = await fetch("/me");

  if (!response.ok) {
    location.href = "/";
    return;
  }

  const data = await response.json();

  myUsername = data.username;

  partnerUsername =
    myUsername === "Shamim"
      ? "muntaha"
      : "Shamim";

  socket.emit("join", myUsername);

  loadMessages();
}


// ==========================
// LOAD OLD MESSAGES
// ==========================

async function loadMessages() {

  const response = await fetch("/messages");

  if (!response.ok) return;

  const messages = await response.json();

  messagesDiv.innerHTML = "";

  messages.forEach(message => {

    addMessage(
      message.from,
      message.text
    );

  });

  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}


// ==========================
// SHOW MESSAGE
// ==========================

function addMessage(from, text) {

  const div = document.createElement("div");

  div.classList.add("message");

  if (from === myUsername) {
    div.classList.add("mine");
  } else {
    div.classList.add("theirs");
  }

  div.textContent = text;

  messagesDiv.appendChild(div);

  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}


// ==========================
// SEND MESSAGE
// ==========================

function sendMessage() {

  const text = messageInput.value.trim();

  if (!text) return;

  socket.emit("send-message", text);

  messageInput.value = "";
}

sendBtn.onclick = sendMessage;

messageInput.addEventListener("keydown", function(e) {

  if (e.key === "Enter") {
    sendMessage();
  }

});


// ==========================
// RECEIVE MESSAGE
// ==========================

socket.on("receive-message", message => {

  addMessage(
    message.from,
    message.text
  );

});


// ==========================
// WEBRTC CONFIG
// ==========================

const rtcConfig = {

  iceServers: [

    {
      urls: "stun:stun.l.google.com:19302"
    }

  ]

};


// ==========================
// CREATE PEER
// ==========================

function createPeerConnection() {

  peerConnection =
    new RTCPeerConnection(rtcConfig);

  peerConnection.onicecandidate =
    event => {

      if (event.candidate) {

        socket.emit("ice-candidate", {

          to: currentCallPartner,

          candidate: event.candidate

        });

      }

    };


  peerConnection.ontrack =
    event => {

      remoteVideo.srcObject =
        event.streams[0];

    };


  peerConnection.onconnectionstatechange =
    () => {

      if (!peerConnection) return;

      const state =
        peerConnection.connectionState;

      if (state === "connected") {

        callStatus.textContent =
          "Connected";

      }

      if (
        state === "disconnected" ||
        state === "failed" ||
        state === "closed"
      ) {

        closeCall(false);

      }

    };

}


// ==========================
// GET MICROPHONE / CAMERA
// ==========================

async function getMedia(type) {

  if (type === "video") {

    return await navigator.mediaDevices.getUserMedia({

      audio: true,

      video: true

    });

  }

  return await navigator.mediaDevices.getUserMedia({

    audio: true,

    video: false

  });

}


// ==========================
// START AUDIO CALL
// ==========================

async function startAudioCall() {

  await startCall("audio");

}


// ==========================
// START VIDEO CALL
// ==========================

async function startVideoCall() {

  await startCall("video");

}


// ==========================
// START CALL
// ==========================

async function startCall(type) {

  try {

    currentCallType = type;

    currentCallPartner =
      partnerUsername;

    showCallScreen(
      type,
      "Calling..."
    );

    localStream =
      await getMedia(type);

    createPeerConnection();

    localStream
      .getTracks()
      .forEach(track => {

        peerConnection.addTrack(
          track,
          localStream
        );

      });


    if (type === "video") {

      localVideo.srcObject =
        localStream;

      localVideo.style.display =
        "block";

      remoteVideo.style.display =
        "block";

    } else {

      localVideo.style.display =
        "none";

      remoteVideo.style.display =
        "none";

    }


    const offer =
      await peerConnection.createOffer();

    await peerConnection.setLocalDescription(
      offer
    );


    socket.emit("call-user", {

      to: currentCallPartner,

      offer: offer,

      callType: type

    });

  }

  catch (error) {

    console.log(error);

    alert(
      "Camera/Microphone permission দিন অথবা ডিভাইসে Camera/Microphone চালু করুন।"
    );

    closeCall(false);

  }

}


// ==========================
// INCOMING CALL
// ==========================

socket.on(
  "incoming-call",
  async data => {

    try {

      const type =
        data.callType || "audio";

      const accept =
        confirm(
          data.from +
          " আপনাকে " +
          (type === "video"
            ? "ভিডিও"
            : "অডিও") +
          " কল করছে। গ্রহণ করবেন?"
        );

      if (!accept) {

        return;

      }


      currentCallType =
        type;

      currentCallPartner =
        data.from;


      showCallScreen(
        type,
        "Connecting..."
      );


      localStream =
        await getMedia(type);

      createPeerConnection();


      localStream
        .getTracks()
        .forEach(track => {

          peerConnection.addTrack(
            track,
            localStream
          );

        });


      if (type === "video") {

        localVideo.srcObject =
          localStream;

        localVideo.style.display =
          "block";

        remoteVideo.style.display =
          "block";

      } else {

        localVideo.style.display =
          "none";

        remoteVideo.style.display =
          "none";

      }


      await peerConnection.setRemoteDescription(
        new RTCSessionDescription(
          data.offer
        )
      );


      const answer =
        await peerConnection.createAnswer();

      await peerConnection.setLocalDescription(
        answer
      );


      socket.emit("answer-call", {

        to: data.from,

        answer: answer

      });

      callStatus.textContent =
        "Connected";

    }

    catch (error) {

      console.log(error);

      alert(
        "কল গ্রহণ করতে Camera/Microphone permission প্রয়োজন।"
      );

      closeCall(false);

    }

  }
);


// ==========================
// CALL ANSWERED
// ==========================

socket.on(
  "call-answered",
  async data => {

    try {

      await peerConnection.setRemoteDescription(

        new RTCSessionDescription(
          data.answer
        )

      );

      callStatus.textContent =
        "Connected";

    }

    catch (error) {

      console.log(error);

    }

  }
);


// ==========================
// ICE CANDIDATE
// ==========================

socket.on(
  "ice-candidate",
  async data => {

    try {

      if (
        peerConnection &&
        data.candidate
      ) {

        await peerConnection.addIceCandidate(

          new RTCIceCandidate(
            data.candidate
          )

        );

      }

    }

    catch (error) {

      console.log(
        "ICE error:",
        error
      );

    }

  }
);


// ==========================
// END CALL FROM OTHER SIDE
// ==========================

socket.on(
  "call-ended",
  () => {

    closeCall(false);

  }
);


// ==========================
// END CALL
// ==========================

function endCall() {

  if (currentCallPartner) {

    socket.emit(
      "end-call",
      {
        to: currentCallPartner
      }
    );

  }

  closeCall(false);

}


// ==========================
// CLOSE CALL
// ==========================

function closeCall(sendSignal) {

  if (sendSignal && currentCallPartner) {

    socket.emit(
      "end-call",
      {
        to: currentCallPartner
      }
    );

  }


  if (localStream) {

    localStream
      .getTracks()
      .forEach(track => {

        track.stop();

      });

    localStream = null;

  }


  if (peerConnection) {

    peerConnection.close();

    peerConnection = null;

  }


  localVideo.srcObject = null;

  remoteVideo.srcObject = null;

  localVideo.style.display =
    "none";

  remoteVideo.style.display =
    "none";

  callScreen.style.display =
    "none";

  currentCallType = null;

  currentCallPartner = null;

}


// ==========================
// CALL SCREEN
// ==========================

function showCallScreen(
  type,
  status
) {

  callScreen.style.display =
    "flex";

  callTitle.textContent =
    type === "video"
      ? "🎥 Video Call"
      : "📞 Audio Call";

  callStatus.textContent =
    status;

}


// START
getMyUser();

</script>

</body>
</html>
